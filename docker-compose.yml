services:
  backend:
    build:
      context: ./fastapi_backend    # <-- This tells Compose the folder to enter
      dockerfile: Dockerfile
    environment:
      - OPENAPI_OUTPUT_FILE=./shared-data/openapi.json
      - DATABASE_URL=postgresql+asyncpg://postgres:password@db:5432/mydatabase
      - TEST_DATABASE_URL=postgresql+asyncpg://postgres:password@db:5433/testdatabase
      - MAIL_SERVER=mailhog
    ports:
      - "8000:8000"
    networks:
      - my_network
    volumes:
      - ./fastapi_backend:/app
      - fastapi-venv:/app/.venv
      - ./local-shared-data:/app/shared-data
      
    depends_on:
      - db
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mydatabase
    ports:
      - "5432:5432"
    networks:
      - my_network
    volumes:
      - postgres_data:/var/lib/postgresql/data
  db_test:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: testdatabase
    ports:
      - "5433:5432"
    networks:
      - my_network
    restart: always

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: salamaai-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ness@gmail.com       # Your login email
      PGADMIN_DEFAULT_PASSWORD: ness # Your login password
    ports:
      - "5050:80"                                  # Access via http://localhost:8080
    networks:
      - my_network

    depends_on:
      - db
      - db_test
  
  
  watcher:
    build:
      context: ./fastapi_backend    # <-- Fix this too! The watcher uses the same Dockerfile
      dockerfile: Dockerfile
    container_name: salamaai-watcher
    command: /app/.venv/bin/python /app/watcher.py
    depends_on:
      - backend
  frontend:
    build:
      context: ./nextjs-frontend
    user: node
    ports:
      - "3000:3000"
    networks:
      - my_network
    environment:
      NODE_ENV: development
      API_BASE_URL: http://backend:8000
      OPENAPI_OUTPUT_FILE: ./shared-data/openapi.json
    volumes:
      - ./nextjs-frontend:/app
      - nextjs-node-modules:/app/node_modules
      - ./local-shared-data:/app/shared-data
  mailhog:
    image: mailhog/mailhog
    ports:
      - "1025:1025" # SMTP server
      - "8025:8025" # Web UI
    networks:
      - my_network

volumes:
  postgres_data:
  nextjs-node-modules:
  fastapi-venv:

networks:
  my_network:
    driver: bridge